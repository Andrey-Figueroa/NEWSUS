<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sus Amigos – Centro Automotriz Premium</title>
    <meta name="description" content="Sus Amigos Detailers Center — Detailing, mecánica y servicio a domicilio de alta calidad en Costa Rica.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar" role="navigation" aria-label="Navegación principal">
        <div class="navbar-inner">

            <!-- IZQUIERDA: Logo -->
            <div class="navbar-left">
                <a href="#" class="navbar-logo-link" aria-label="Sus Amigos – Inicio">
                    <img src="images/Logos/SusAmigosLogotipo.png" alt="Sus Amigos Logo" class="navbar-logo">
                </a>
            </div>

            <!-- CENTRO: Menú de navegación -->
            <ul class="navbar-menu" id="navbar-menu" role="menubar">
                <li role="none"><a href="#" class="nav-link" role="menuitem">Inicio</a></li>
                <li role="none"><a href="#nosotros" class="nav-link" role="menuitem">Nosotros</a></li>

                <!-- Dropdown Servicios -->
                <li class="nav-item--dropdown" role="none">
                    <button class="nav-link nav-link--dropdown" aria-haspopup="true" aria-expanded="false" id="servicios-btn" role="menuitem">
                        Servicios
                        <svg class="dropdown-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                            <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <ul class="dropdown-menu" id="dropdown-menu" role="menu" aria-labelledby="servicios-btn">
                        <li role="none"><a href="#detailing" class="dropdown-item" role="menuitem">Detailing</a></li>
                        <li role="none"><a href="#mecanica" class="dropdown-item" role="menuitem">Mecánica</a></li>
                        <li role="none"><a href="#domicilio" class="dropdown-item" role="menuitem">Servicio a domicilio</a></li>
                    </ul>
                </li>

                <li role="none"><a href="#sucursal" class="nav-link" role="menuitem">Sucursal</a></li>
                <li role="none"><a href="#contacto" class="nav-link" role="menuitem">Contacto</a></li>
            </ul>

            <!-- DERECHA: Redes + CTA -->
            <div class="navbar-right">
                <a href="https://www.facebook.com/SusAmigos.DetailersCenter" target="_blank" rel="noopener noreferrer" class="nav-social-btn" id="nav-facebook" aria-label="Facebook">
                    <img src="images/Iconos/facebook.svg" alt="Facebook" class="nav-social-icon">
                </a>
                <a href="https://www.instagram.com/susamigos.centrodeservicios/" target="_blank" rel="noopener noreferrer" class="nav-social-btn" id="nav-instagram" aria-label="Instagram">
                    <img src="images/Iconos/instagram.svg" alt="Instagram" class="nav-social-icon">
                </a>
                <a href="#contacto" class="nav-cta" id="nav-cta">Agendar Cita</a>

                <!-- Hamburguesa (móvil) -->
                <button class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-menu">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
            </div>

        </div>
    </nav>

    <!-- ===== MENÚ MÓVIL ===== -->
    <div class="mobile-overlay" id="mobile-overlay" aria-hidden="true"></div>
    <aside class="mobile-menu" id="mobile-menu" aria-label="Menú móvil" aria-hidden="true">
        <button class="mobile-menu__close" id="mobile-close" aria-label="Cerrar menú">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
        <nav class="mobile-menu__nav">
            <a href="#" class="mobile-link">Inicio</a>
            <a href="#nosotros" class="mobile-link">Nosotros</a>
            <div class="mobile-link mobile-link--parent">Servicios</div>
            <div class="mobile-submenu">
                <a href="#detailing" class="mobile-sublink">Detailing</a>
                <a href="#mecanica" class="mobile-sublink">Mecánica</a>
                <a href="#domicilio" class="mobile-sublink">Servicio a domicilio</a>
            </div>
            <a href="#sucursal" class="mobile-link">Sucursal</a>
            <a href="#contacto" class="mobile-link">Contacto</a>
            <a href="#contacto" class="mobile-cta">Agendar Cita</a>
        </nav>
    </aside>

    <!-- ===== HERO ===== -->
    <section class="hero-container">
        <div class="hero-overlay"></div>
    </section>

    <!-- Bloque temporal para scroll -->
    <section class="scroll-block"></section>

    <!-- ===== WHATSAPP FLOTANTE ===== -->
    <a href="https://wa.me/50670491753" target="_blank" rel="noopener noreferrer" class="whatsapp-widget" id="whatsapp-widget" aria-label="SusAmigos WhatsApp">
        <span class="whatsapp-label">SusAmigos Whatsapp</span>
        <img src="images/Iconos/whatsapp.svg" alt="WhatsApp" class="whatsapp-icon">
    </a>

    <script src="script.js"></script>
</body>
</html>
