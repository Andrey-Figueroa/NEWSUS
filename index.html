<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Taller Mecánico</title>
    <!-- Fuente moderna e impactante -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <img src="images/Logos/SusAmigosLogotipo.png" alt="Sus Amigos Logo" class="navbar-logo">

        <!-- Pastilla dorada derecha -->
        <div class="navbar-pill">
            <a href="https://www.facebook.com/SusAmigos.DetailersCenter" target="_blank" class="pill-icon-btn" id="pill-btn-facebook" aria-label="Facebook">
                <img src="images/Iconos/facebook.svg" alt="Facebook" class="pill-icon-img">
            </a>
            <div class="pill-divider"></div>
            <a href="https://www.instagram.com/susamigos.centrodeservicios/" target="_blank" class="pill-icon-btn" id="pill-btn-instagram" aria-label="Instagram">
                <img src="images/Iconos/instagram.svg" alt="Instagram" class="pill-icon-img">
            </a>
        </div>
    </nav>

    <section class="hero-container">
        <div class="hero-overlay"></div>
    </section>
    <!-- ===== WHATSAPP FLOTANTE ===== -->
    <a href="https://wa.me/50670491753" target="_blank" class="whatsapp-widget" id="whatsapp-widget" aria-label="SusAmigos WhatsApp">
        <span class="whatsapp-label">SusAmigos Whatsapp</span>
        <img src="images/Iconos/whatsapp.svg" alt="WhatsApp" class="whatsapp-icon">
    </a>

</body>
</html>
